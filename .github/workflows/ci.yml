name: CI

# NOTE: this workspace has no GitHub remote configured yet (checked
# 2026-09-11 — `git remote -v` is empty here); this workflow is prepared
# ahead of that, per the mxrs plan's Wave 0 (decisions/mxrs-rust-rewrite-plan.md
# in this project's ai-memory). It activates once the repo is pushed under
# `lucamykael/mxrs` and mirrors the local development gate documented in
# README.md and .claude/agents/mxrs-rust.md's rule #6 ("full green before
# you call anything done"): fmt, clippy, tests, then the two mxrb-backed
# oracles, run against a sibling checkout of mxrb (never a runtime
# dependency of anything mxrs ships — dev/CI-only, same as `xtask` itself).

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt-clippy-test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  frontend-reproducibility:
    name: embedded React bundle is reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26.2.0"
          cache: npm
          cache-dependency-path: crates/compiler/mxrs-materializers/frontend/package-lock.json
      - run: npm ci --prefix crates/compiler/mxrs-materializers/frontend
      - run: npm run build --prefix crates/compiler/mxrs-materializers/frontend
      - run: test -z "$(git status --porcelain -- crates/compiler/mxrs-materializers/assets)"

  mxrb-oracle:
    name: oracle-diff + noise-audit (against mxrb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: mxrs
      # mxrb is mxrs's read-only behavioral oracle (never a runtime
      # dependency — see the crate docs and .claude/agents/mxrs-rust.md).
      # Checked out as a sibling directory so MXRB_HOME's default
      # (`../mxrb` relative to mxrs) resolves without extra configuration.
      - uses: actions/checkout@v4
        with:
          repository: lucamykael/mxrb
          path: mxrb
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mxrs
      - uses: ruby/setup-ruby@v1
        with:
          # mxrb.gemspec pins `required_ruby_version = ">= 4.0"` — verified
          # against the current gemspec, not assumed.
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: mxrb
      - name: oracle-diff (minimal fixture)
        working-directory: mxrs
        env:
          MXRB_HOME: ${{ github.workspace }}/mxrb
        run: cargo run -p xtask -- oracle-diff xtask/fixtures/minimal
      - name: oracle-diff (with_page fixture)
        working-directory: mxrs
        env:
          MXRB_HOME: ${{ github.workspace }}/mxrb
        run: cargo run -p xtask -- oracle-diff xtask/fixtures/with_page
      - name: noise-audit
        working-directory: mxrs
        run: cargo run -p xtask -- noise-audit
      - name: MXRB command capability matrix ratchet
        working-directory: mxrs
        env:
          MXRB_HOME: ${{ github.workspace }}/mxrb
        run: |
          cargo run -q -p xtask -- capability-matrix --json --check-baseline > target/capability-matrix.json
      - name: command readiness (no partial or missing commands allowed)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        working-directory: mxrs
        env:
          MXRB_HOME: ${{ github.workspace }}/mxrb
        run: cargo run -q -p xtask -- capability-matrix --check-baseline --require-complete
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: command-capabilities-${{ github.sha }}
          path: mxrs/target/capability-matrix.json
          if-no-files-found: error

  coverage:
    name: coverage ratchet (lines + branches)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      # 2026-09-13 isolated baseline, including generated Cargo applications:
      # 82.74% lines / 82.28% functions / 81.66% regions / 66.13% branches.
      # Development floors: 82 / 82 / 81 / 66%, respectively.
      # These floors are a ratchet, not the destination; raise them whenever
      # tests land until all four reach the project target of 100%.
      # Each run has new outer/nested Cargo directories: clean --workspace
      # alone can leave old ELF maps from another toolchain/layout behind.
      # No source exclusion or lowered threshold is allowed to obtain 100%.
      - name: fresh complete instrumentation (including generated Cargo applications)
        id: measure-coverage
        run: bash xtask/coverage.sh target/coverage.json
      - name: validate all counters and enforce development floors
        run: cargo run -q -p xtask -- coverage-gate target/coverage.json --json > target/coverage-gate.json
      # This is intentionally not continue-on-error. A release/tag or explicit
      # readiness run cannot pass while any instrumented item is uncovered.
      # It is a coverage gate, not proof of official Studio Pro compatibility.
      - name: release readiness (100% lines, functions, regions and branches)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: cargo run -q -p xtask -- coverage-gate target/coverage.json --require-complete
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-evidence-${{ github.sha }}
          path: |
            target/coverage.json
            target/coverage-gate.json
            ${{ steps.measure-coverage.outputs.evidence_dir }}/toolchain.txt
            ${{ steps.measure-coverage.outputs.evidence_dir }}/source.sha256
            ${{ steps.measure-coverage.outputs.evidence_dir }}/objects.txt
            ${{ steps.measure-coverage.outputs.evidence_dir }}/objects.sha256
            ${{ steps.measure-coverage.outputs.evidence_dir }}/workspace/*.profraw
            ${{ steps.measure-coverage.outputs.evidence_dir }}/workspace/*.profdata
          if-no-files-found: error

  benches-build:
    name: benches (build + smoke run, not a perf gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Shared GitHub-hosted runners are too noisy for reliable
      # regression tracking — this only proves the bench harness stays
      # buildable and runnable, not that performance hasn't regressed.
      # Real perf tracking needs a dedicated/self-hosted runner, not yet
      # set up.
      - run: cargo bench -p mxrs-bson --bench codec -- --sample-count 10
      - run: cargo bench -p mxrs-runtime --bench core -- --sample-count 10
