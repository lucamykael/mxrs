[package]
name = "mxrs-compiler-domain"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Compiles an mxrs-model DomainModel from editor shape into Mendix Runtime shape, including security and OQL view-source resolution."

[lints]
workspace = true

[dependencies]
mxrs-bson = { path = "../mxrs-bson" }
mxrs-model = { path = "../mxrs-model" }
thiserror.workspace = true
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
mxrs-dsl = { path = "../mxrs-dsl" }
mxrs-ir = { path = "../mxrs-ir" }
mxrs-mpr = { path = "../mxrs-mpr" }
mxrs-writer = { path = "../mxrs-writer" }
tempfile = "3.27.0"
