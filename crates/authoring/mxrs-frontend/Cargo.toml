[package]
name = "mxrs-frontend"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Reads the user interface a project declares in its frontend's TypeScript — navigation, and in time layouts, pages and nanoflows — into the same declarations the Rust authoring surface produces."

[dependencies]
mxrs-dsl = { path = "../mxrs-dsl" }
mxrs-expr = { path = "../mxrs-expr" }
mxrs-ir = { path = "../mxrs-ir" }
oxc_allocator = "=0.146.0"
oxc_ast = "=0.146.0"
oxc_parser = "=0.146.0"
oxc_span = "=0.146.0"
serde.workspace = true
serde_json.workspace = true
serde_path_to_error = "0.1"
thiserror.workspace = true

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
