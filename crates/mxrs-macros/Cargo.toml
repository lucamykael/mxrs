[package]
name = "mxrs-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Phase 8 (M8.1): project! {} proc-macro sugar over mxrs-dsl's builder API. Every expansion lowers to calls against mxrs-dsl pub fns already usable by hand — this crate adds no capability mxrs-dsl doesn't already expose, only syntax."

[lints]
workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }

[build-dependencies]
mxrs-typegen = { path = "../mxrs-typegen" }

[dev-dependencies]
mxrs-bson = { path = "../mxrs-bson" }
mxrs-dsl = { path = "../mxrs-dsl" }
mxrs-expr = { path = "../mxrs-expr" }
mxrs-ir = { path = "../mxrs-ir" }
mxrs-model = { path = "../mxrs-model" }
mxrs-writer = { path = "../mxrs-writer" }
tempfile = "3.27.0"
