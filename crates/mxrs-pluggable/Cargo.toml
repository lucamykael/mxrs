[package]
name = "mxrs-pluggable"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Typed model and bidirectional BSON codec for Mendix pluggable (CustomWidgets) widgets."

[lints]
workspace = true

[dependencies]
mxrs-bson = { path = "../mxrs-bson" }
mxrs-forms-refs = { path = "../mxrs-forms-refs" }
thiserror.workspace = true
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# Dev-only, test-scoped: safe despite mxrs-forms depending on this crate
# normally — Cargo builds a `[dev-dependencies]` cycle in two separate
# graphs (the library graph mxrs-forms itself builds against doesn't
# include this crate's tests). Lets instance_oracle.rs measure real
# TextTemplate/Action/Icon decode via a genuine
# `mxrs_forms::MprCodec`-backed `EmbeddedFormsDecoder`, instead of a
# fake/no-op stand-in that couldn't produce honest numbers.
mxrs-forms = { path = "../mxrs-forms" }
mxrs-mpr = { path = "../mxrs-mpr" }
