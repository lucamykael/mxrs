[package]
name = "mxrs-exporter"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Imports an existing .mpr as an editable Cargo project with typed domain, document, security, navigation and supported page projections over a lossless model snapshot, plus explicit portability audits."

[lints]
workspace = true

[dependencies]
mxrs-bson = { path = "../../io/mxrs-bson" }
mxrs-ir = { path = "../../authoring/mxrs-ir" }
mxrs-model = { path = "../../model/mxrs-model" }
mxrs-forms = { path = "../../model/mxrs-forms" }
mxrs-project = { path = "../mxrs-project" }
mxrs-typegen = { path = "../../authoring/mxrs-typegen" }
mxrs-writer = { path = "../../writer/mxrs-writer" }
serde.workspace = true
serde_json.workspace = true
tempfile = "3.27.0"
thiserror.workspace = true

[dev-dependencies]
mxrs-dsl = { path = "../../authoring/mxrs-dsl" }
mxrs-macros = { path = "../../authoring/mxrs-macros" }
mxrs-mpr = { path = "../../io/mxrs-mpr" }
uuid = { version = "1", features = ["v4"] }
