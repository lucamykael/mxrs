[package]
name = "mxrs-runtime-http"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Async HTTP and static-web adapter for the MXRS runtime core."

[lints]
workspace = true

[dependencies]
axum = "0.8.7"
mxrs-runtime = { path = "../mxrs-runtime" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1.52.0", features = ["net", "rt-multi-thread"] }
tower-http = { version = "0.6.8", features = ["fs"] }

[dev-dependencies]
http-body-util = "0.1.3"
tempfile = "3.27.0"
tokio = { version = "1.52.0", features = ["macros"] }
tower = { version = "0.5.2", features = ["util"] }
