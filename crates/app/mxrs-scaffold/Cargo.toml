[package]
name = "mxrs-scaffold"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Transactional Cargo-native application scaffolds for MXRS."

[lints]
workspace = true

[dependencies]
mxrs-frontend = { path = "../../authoring/mxrs-frontend" }
mxrs-bson = { path = "../../io/mxrs-bson" }
mxrs-forms = { path = "../../model/mxrs-forms" }
mxrs-ir = { path = "../../authoring/mxrs-ir" }
mxrs-writer = { path = "../../writer/mxrs-writer" }
mxrs-materializers = { path = "../../compiler/mxrs-materializers" }
syn = { version = "2", features = ["full", "visit"] }
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
tempfile = "3.27.0"
toml = { version = "1.1", default-features = false, features = ["std", "parse"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
mxrs-model = { path = "../../model/mxrs-model" }
