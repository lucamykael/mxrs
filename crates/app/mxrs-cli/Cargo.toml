[package]
name = "mxrs-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The `mxrs` binary: import an MPR into a Cargo-native project, rebuild it, and inspect/validate/compare Mendix model artifacts."

[lints]
workspace = true

[[bin]]
name = "mxrs"
path = "src/main.rs"

[[bin]]
name = "cargo-mxrs"
path = "src/cargo_mxrs.rs"

[dependencies]
mxrs-bson = { path = "../../io/mxrs-bson" }
mxrs-compiler-flow = { path = "../../compiler/mxrs-compiler-flow" }
mxrs-compiler-widgets = { path = "../../compiler/mxrs-compiler-widgets" }
mxrs-exporter = { path = "../mxrs-exporter" }
mxrs-javagen = { path = "../../compiler/mxrs-javagen" }
mxrs-materializers = { path = "../../compiler/mxrs-materializers" }
mxrs-packager = { path = "../mxrs-packager" }
mxrs-mpr = { path = "../../io/mxrs-mpr" }
mxrs-marketplace = { path = "../mxrs-marketplace" }
mxrs-module-catalog = { path = "../mxrs-module-catalog" }
mxrs-model = { path = "../../model/mxrs-model" }
mxrs-ir = { path = "../../authoring/mxrs-ir" }
mxrs-oql = { path = "../../compiler/mxrs-oql" }
mxrs-project = { path = "../mxrs-project" }
mxrs-query-server = { path = "../mxrs-query-server" }
mxrs-refactor = { path = "../mxrs-refactor" }
mxrs-runtime = { path = "../mxrs-runtime" }
mxrs-runtime-boot = { path = "../mxrs-runtime-boot" }
mxrs-runtime-flows = { path = "../mxrs-runtime-flows" }
mxrs-runtime-http = { path = "../mxrs-runtime-http" }
mxrs-runtime-scheduler = { path = "../mxrs-runtime-scheduler" }
mxrs-runtime-sqlite = { path = "../mxrs-runtime-sqlite" }
mxrs-scaffold = { path = "../mxrs-scaffold" }
mxrs-writer = { path = "../../writer/mxrs-writer" }
mxrs-semantic = { path = "../../compiler/mxrs-semantic" }
regex = "1"
serde_json.workspace = true
serde.workspace = true
sha2 = "0.10"
tempfile = "3.27.0"
thiserror.workspace = true
tokio = { version = "1.52.0", features = ["rt-multi-thread", "signal", "time"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
mxrs-dsl = { path = "../../authoring/mxrs-dsl" }
zip = { version = "2", default-features = false, features = ["deflate"] }
