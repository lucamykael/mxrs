[package]
name = "mxrs-marketplace"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Client for the official Mendix Marketplace Content API: search published content, list versions, resolve a version for a Mendix target, and download its package. HTTP transport is a trait, so every parsing and validation rule is tested offline against recorded responses."

[lints]
workspace = true

[dependencies]
mxrs-mpr = { path = "../../io/mxrs-mpr" }
# A .mpk is a zip holding an .mpr plus assets, and package.xml is namespaced
# XML. Neither is safe to parse by hand; both dependencies are confined to
# `package`.
quick-xml = "0.38"
serde = { workspace = true }
serde_json.workspace = true
thiserror.workspace = true
# The workspace's only HTTPS client. Confined to this crate's `ureq_transport`
# module: nothing else here needs the network, and `Transport` keeps the API
# logic testable without it.
ureq = { version = "3", default-features = false, features = ["rustls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

tempfile = "3.27.0"

[dev-dependencies]
mxrs-dsl = { path = "../../authoring/mxrs-dsl" }
mxrs-model = { path = "../../model/mxrs-model" }
mxrs-writer = { path = "../../writer/mxrs-writer" }
zip = { version = "2", default-features = false, features = ["deflate"] }
