[package]
name = "mxrs-forms"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Typed, lossless BSON codec for the Mendix Forms metamodel (pages, widgets, actions). Ports lib/mxrb/forms/{catalog,values,node,storage_naming,mpr_codec}.rb from mxrb."

[lints]
workspace = true

[dependencies]
mxrs-bson = { path = "../../io/mxrs-bson" }
mxrs-forms-refs = { path = "../mxrs-forms-refs" }
mxrs-fragment-store = { path = "../../io/mxrs-fragment-store" }
mxrs-pluggable = { path = "../mxrs-pluggable" }
regex = "1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror.workspace = true
uuid = { version = "1", features = ["v4"] }
