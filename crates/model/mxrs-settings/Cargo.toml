[package]
name = "mxrs-settings"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Typed, lossless BSON codec for Mendix project settings (Settings$ProjectSettings and its parts). Ports lib/mxrb/settings/{model,mpr_codec,value_contracts}.rb from mxrb."

[lints]
workspace = true

[dependencies]
mxrs-bson = { path = "../../io/mxrs-bson" }
mxrs-schema = { path = "../mxrs-schema" }
regex = "1.13.1"
sha2 = "0.10"
thiserror.workspace = true

[dev-dependencies]
mxrs-mpr = { path = "../../io/mxrs-mpr" }
