[package]
name = "mxrs-writer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Persists an mxrs-ir::ProjectDecl into a fresh .mpr, and incrementally re-syncs an existing one's domain model, microflows, enumerations, and native/structural pages."

[lints]
workspace = true

[dependencies]
mxrs-bson = { path = "../mxrs-bson" }
mxrs-forms = { path = "../mxrs-forms" }
mxrs-ir = { path = "../mxrs-ir" }
mxrs-identity = { path = "../mxrs-identity" }
mxrs-model = { path = "../mxrs-model" }
mxrs-mpr = { path = "../mxrs-mpr" }
mxrs-schema = { path = "../mxrs-schema" }
thiserror.workspace = true
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
mxrs-dsl = { path = "../mxrs-dsl" }
mxrs-expr = { path = "../mxrs-expr" }
tempfile = "3.27.0"
