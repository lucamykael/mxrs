[package]
name = "mxrs-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The `mxrs` binary: a Phase 6 CLI skeleton (validate/compare) over mxrs-mpr and mxrs-model. Ports the storage-format-invariant slice of Integrity::Validator and the structural-summary slice of Mxrb::Compare — see the crate's module docs for exactly what's narrowed."

[lints]
workspace = true

[[bin]]
name = "mxrs"
path = "src/main.rs"

[dependencies]
mxrs-bson = { path = "../mxrs-bson" }
mxrs-exporter = { path = "../mxrs-exporter" }
mxrs-javagen = { path = "../mxrs-javagen" }
mxrs-mpr = { path = "../mxrs-mpr" }
mxrs-model = { path = "../mxrs-model" }
serde_json.workspace = true
sha2 = "0.10"

[dev-dependencies]
mxrs-dsl = { path = "../mxrs-dsl" }
mxrs-writer = { path = "../mxrs-writer" }
mxrs-ir = { path = "../mxrs-ir" }
tempfile = "3.27.0"
uuid = { version = "1", features = ["v4"] }
