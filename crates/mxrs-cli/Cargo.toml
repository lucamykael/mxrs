[package]
name = "mxrs-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The `mxrs` binary: import an MPR into a Cargo-native project, rebuild it, and inspect/validate/compare Mendix model artifacts."

[lints]
workspace = true

[[bin]]
name = "mxrs"
path = "src/main.rs"

[[bin]]
name = "cargo-mxrs"
path = "src/cargo_mxrs.rs"

[dependencies]
mxrs-bson = { path = "../mxrs-bson" }
mxrs-exporter = { path = "../mxrs-exporter" }
mxrs-javagen = { path = "../mxrs-javagen" }
mxrs-mpr = { path = "../mxrs-mpr" }
mxrs-model = { path = "../mxrs-model" }
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true

[dev-dependencies]
mxrs-dsl = { path = "../mxrs-dsl" }
mxrs-writer = { path = "../mxrs-writer" }
mxrs-ir = { path = "../mxrs-ir" }
tempfile = "3.27.0"
uuid = { version = "1", features = ["v4"] }
