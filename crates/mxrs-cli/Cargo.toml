[package]
name = "mxrs-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The `mxrs` binary: validate/compare/inspect/units/dump-unit/sql/modules/export/javagen over mxrs-mpr and mxrs-model — a narrow slice of bin/mxrb's ~80-command surface, growing as engine crates land. See the crate's module docs for exactly what's narrowed per command."

[lints]
workspace = true

[[bin]]
name = "mxrs"
path = "src/main.rs"

[dependencies]
mxrs-bson = { path = "../mxrs-bson" }
mxrs-exporter = { path = "../mxrs-exporter" }
mxrs-javagen = { path = "../mxrs-javagen" }
mxrs-mpr = { path = "../mxrs-mpr" }
mxrs-model = { path = "../mxrs-model" }
serde_json.workspace = true
sha2 = "0.10"

[dev-dependencies]
mxrs-dsl = { path = "../mxrs-dsl" }
mxrs-writer = { path = "../mxrs-writer" }
mxrs-ir = { path = "../mxrs-ir" }
tempfile = "3.27.0"
uuid = { version = "1", features = ["v4"] }
