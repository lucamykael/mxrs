[package]
name = "mxrs-mpr"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Low-level Mendix .mpr SQLite/BSON unit I/O (v2 .mxunit storage). Ports lib/mxrb/io/mpr_file.rb + mxunit_codec.rb from mxrb — v2-only per the locked 11.x MVP scope."

[lints]
workspace = true

[dependencies]
mxrs-bson = { path = "../mxrs-bson" }
rusqlite = { version = "0.40.2", features = ["bundled", "hooks"] }
uuid = { version = "1.26.0", features = ["v4"] }
thiserror.workspace = true
serde_json.workspace = true
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
tempfile = "3.27.0"
