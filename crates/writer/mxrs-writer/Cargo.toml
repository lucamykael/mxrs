[package]
name = "mxrs-writer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Persists an mxrs-ir::ProjectDecl into a fresh .mpr and losslessly re-syncs supported domain, document, page, navigation, and security edits into an existing project."

[lints]
workspace = true

[dependencies]
mxrs-bson = { path = "../../io/mxrs-bson" }
mxrs-forms = { path = "../../model/mxrs-forms" }
mxrs-ir = { path = "../../authoring/mxrs-ir" }
mxrs-identity = { path = "../mxrs-identity" }
mxrs-model = { path = "../../model/mxrs-model" }
mxrs-mpr = { path = "../../io/mxrs-mpr" }
mxrs-pluggable = { path = "../../model/mxrs-pluggable" }
mxrs-widget-package = { path = "../../model/mxrs-widget-package" }
mxrs-schema = { path = "../../model/mxrs-schema" }
thiserror.workspace = true
uuid = { version = "1", features = ["v4", "v5"] }

[dev-dependencies]
mxrs-dsl = { path = "../../authoring/mxrs-dsl" }
mxrs-expr = { path = "../../authoring/mxrs-expr" }
tempfile = "3.27.0"
# Builds fixture .mpk widget packages for the package-schema sync tests.
zip = { version = "2", default-features = false, features = ["deflate"] }
