[package]
name = "mxrs-oql"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Fail-closed OQL discovery, analysis, and logical SQL projection for MXRS."

[lints]
workspace = true

[dependencies]
mxrs-bson = { path = "../../io/mxrs-bson" }
mxrs-model = { path = "../../model/mxrs-model" }
mxrs-relational-schema = { path = "../../model/mxrs-relational-schema" }
regex = "1"
serde.workspace = true
# `preserve_order` is load-bearing here, not incidental: a workload baseline
# is a JSON object keyed by query id, and its key order is part of the
# snapshot's byte-for-byte shape.
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true

[dev-dependencies]
mxrs-dsl = { path = "../../authoring/mxrs-dsl" }
mxrs-ir = { path = "../../authoring/mxrs-ir" }
mxrs-writer = { path = "../../writer/mxrs-writer" }
tempfile = "3.27.0"
