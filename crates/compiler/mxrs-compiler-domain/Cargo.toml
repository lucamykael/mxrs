[package]
name = "mxrs-compiler-domain"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Compiles an mxrs-model DomainModel from editor shape into Mendix Runtime shape, including security and OQL view-source resolution."

[lints]
workspace = true

[dependencies]
mxrs-bson = { path = "../../io/mxrs-bson" }
mxrs-compiler-support = { path = "../mxrs-compiler-support" }
mxrs-model = { path = "../../model/mxrs-model" }
thiserror.workspace = true
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
mxrs-dsl = { path = "../../authoring/mxrs-dsl" }
mxrs-ir = { path = "../../authoring/mxrs-ir" }
mxrs-mpr = { path = "../../io/mxrs-mpr" }
mxrs-writer = { path = "../../writer/mxrs-writer" }
tempfile = "3.27.0"
