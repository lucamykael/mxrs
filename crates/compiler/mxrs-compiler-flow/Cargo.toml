[package]
name = "mxrs-compiler-flow"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Compiles mxrb microflow/nanoflow/rule/code-action/database-connector-action editor documents into Mendix Runtime shape (and, for nanoflows, into client-side JS instruction programs). Second crate of Phase 5's compiler pipeline, sibling to mxrs-compiler-domain."

[lints]
workspace = true

[dependencies]
mxrs-bson = { path = "../../io/mxrs-bson" }
mxrs-compiler-support = { path = "../mxrs-compiler-support" }
mxrs-model = { path = "../../model/mxrs-model" }
mxrs-schema = { path = "../../model/mxrs-schema" }
thiserror.workspace = true
sha2 = "0.10"
serde_json.workspace = true
regex = "1"

[dev-dependencies]
mxrs-dsl = { path = "../../authoring/mxrs-dsl" }
mxrs-expr = { path = "../../authoring/mxrs-expr" }
mxrs-ir = { path = "../../authoring/mxrs-ir" }
mxrs-mpr = { path = "../../io/mxrs-mpr" }
mxrs-writer = { path = "../../writer/mxrs-writer" }
tempfile = "3.27.0"
